<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel | Laiza Elc</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Ctext x='16' y='22' font-family='Arial Narrow,Arial' font-size='15' fill='%23C5A059' text-anchor='middle'%3ELE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/admin/admin.css?v=1">
</head>
<body>

  <div class="boot" id="boot" aria-label="Carregando"><span class="spinner"></span></div>

  <!-- Login -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="loginForm" novalidate>
      <p class="login__brand">Laiza Elc</p>
      <h1 class="login__title">Painel do site</h1>
      <p class="login__lead" id="loginLead">Entre para editar vídeos, textos e fotos do portfólio.</p>

      <label class="field">
        <span class="field__label">Usuário</span>
        <input class="input" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field__label">Senha</span>
        <span class="input-wrap">
          <input class="input" type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="input-icon" id="pwToggle" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" name="remember" checked>
        <span>Manter conectado por 30 dias</span>
      </label>

      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" id="loginBtn">Entrar</button>
    </form>
    <a class="login__back" href="/">Voltar para o site</a>
  </main>

  <!-- Aviso quando o Cloudflare ainda não foi configurado -->
  <main class="login" id="setup" hidden>
    <div class="login__card">
      <p class="login__brand">Laiza Elc</p>
      <h1 class="login__title">Painel ainda não configurado</h1>
      <p class="login__lead" id="setupText"></p>
    </div>
  </main>

  <!-- Painel -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <div class="side__brand">Laiza Elc <span>Painel</span></div>
      <nav class="side__nav" id="nav" aria-label="Seções do painel">
        <button type="button" data-view="videos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.3-2.5z"/></svg>
          <span>Vídeos</span><em class="badge" data-count="videos"></em>
        </button>
        <button type="button" data-view="cine">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="11" rx="2"/><path d="M4 19h4M10 19h4M16 19h4"/></svg>
          <span>Seleção do topo</span><em class="badge" data-count="cine"></em>
        </button>
        <button type="button" data-view="texts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 11h14M5 16h9"/></svg>
          <span>Textos</span>
        </button>
        <button type="button" data-view="photos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5.5-5L6 19"/></svg>
          <span>Fotos</span>
        </button>
        <button type="button" data-view="collabs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.7-3 2.8-4.6 5.5-4.6s4.8 1.6 5.5 4.6"/><circle cx="17" cy="8" r="2.4"/><path d="M16 13.3c2.2.1 3.9 1.5 4.5 4"/></svg>
          <span>Colaborações</span><em class="badge" data-count="collabs"></em>
        </button>
        <button type="button" data-view="reel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.8v6.4l5.3-3.2z"/></svg>
          <span>Showreel</span>
        </button>
      </nav>
      <div class="side__foot">
        <a class="side__link" href="/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          Ver site
        </a>
        <button type="button" class="side__link" id="logout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
          Sair
        </button>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>

    <div class="savebar" id="savebar" aria-live="polite">
      <p class="savebar__text"><span class="savebar__dot" aria-hidden="true"></span><span id="savebarText">Alterações não salvas</span></p>
      <div class="savebar__actions">
        <button type="button" class="btn btn--ghost" id="discard">Descartar</button>
        <button type="button" class="btn btn--primary" id="save">Salvar e publicar</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog class="modal" id="modal">
    <form method="dialog" class="modal__card" id="modalForm">
      <h2 class="modal__title" id="modalTitle"></h2>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" value="cancel" id="modalCancel">Cancelar</button>
        <button type="submit" class="btn btn--primary" value="ok" id="modalOk">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="/admin/vendor/Sortable.min.js"></script>
  <script src="/admin/admin.js?v=1" defer></script>
</body>
</html>
